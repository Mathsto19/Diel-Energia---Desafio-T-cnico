<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Circuito ESP32 e botão no GPIO 27</title>
  <desc id="desc">Esquema baseado em firmware/diagram.json, não é captura do Wokwi. Botão entre GPIO 27 e GND, com pull-up interno.</desc>
  <rect width="1000" height="560" rx="20" fill="#f1f5f9"/>
  <g font-family="Segoe UI, sans-serif" fill="#0f172a">
    <text x="45" y="54" font-size="28" font-weight="700">Circuito • ESP32 + botão</text>
    <text x="45" y="86" font-size="16" fill="#475569">Esquema de ligação baseado em firmware/diagram.json — não é print do Wokwi.</text>
    <rect x="80" y="130" width="280" height="300" rx="18" fill="#0f172a"/>
    <rect x="125" y="156" width="190" height="90" rx="8" fill="#cbd5e1"/>
    <text x="220" y="197" text-anchor="middle" font-size="25" font-weight="700">ESP32</text>
    <text x="220" y="224" text-anchor="middle" font-size="15">DevKit V1</text>
    <text x="112" y="292" fill="#f8fafc" font-size="18">GPIO 27</text>
    <text x="112" y="362" fill="#f8fafc" font-size="18">GND</text>
    <rect x="184" y="393" width="72" height="37" rx="5" fill="#94a3b8"/>
    <circle cx="360" cy="286" r="7" fill="#22c55e"/>
    <circle cx="360" cy="356" r="7" fill="#94a3b8"/>
    <path d="M367 286 H535 V240 H680" fill="none" stroke="#16a34a" stroke-width="5"/>
    <path d="M367 356 H810 V300 H770" fill="none" stroke="#334155" stroke-width="5"/>
    <rect x="665" y="205" width="120" height="125" rx="12" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="725" cy="267" r="35" fill="#2563eb"/>
    <text x="725" y="275" text-anchor="middle" fill="white" font-size="23" font-weight="700">B</text>
    <circle cx="680" cy="240" r="6" fill="#16a34a"/>
    <circle cx="770" cy="300" r="6" fill="#334155"/>
    <text x="600" y="178" font-size="20" font-weight="600">Botão momentâneo</text>
    <text x="550" y="226" font-size="15" fill="#166534">1.l</text>
    <text x="828" y="288" font-size="15">2.r</text>
    <text x="468" y="391" font-size="17">Contatos de grupos diferentes: 1.l e 2.r</text>
    <rect x="45" y="458" width="910" height="65" rx="12" fill="#dbeafe"/>
    <text x="65" y="485" font-size="17">Solto: GPIO = 1 (pull-up interno)   •   Pressionado: GPIO = 0 (ligado ao GND)</text>
    <text x="65" y="510" font-size="16">Temperatura e umidade chegam pela rede Modbus TCP; não há sensor físico neste circuito.</text>
  </g>
</svg>
